<div class="login-page">

  <!-- Left Hero Panel (Large screens) -->
  <div class="login-left d-none d-lg-flex flex-column justify-content-between p-5">

    <!-- Top Brand -->
    <div class="d-flex align-items-center gap-2">
      <div class="brand-icon d-flex align-items-center justify-content-center">
        <i class="bi bi-box-seam-fill"></i>
      </div>
      <span class="brand-name">WIMS</span>
    </div>

    <!-- Center Pitch (Clean & Simple) -->
    <div class="hero-content my-auto">
      <p class="left-eyebrow mb-3">Warehouse & Inventory Management</p>
      <h1 class="left-heading mb-3">
        Everything in<br>its right place.
      </h1>
      <p class="left-sub mb-0">
        Manage stock, track shipments, and control your warehouses — all from one place.
      </p>
    </div>

    <!-- Minimal bottom spacer -->
    <div class="left-footer"></div>

  </div>

  <!-- Right Form Panel -->
  <div class="login-right d-flex align-items-center justify-content-center p-3 p-sm-4 p-md-5">
    <div class="form-card w-100">

      <!-- Mobile Brand Header -->
      <div class="d-flex d-lg-none align-items-center gap-2 mb-4 justify-content-center">
        <div class="brand-icon mobile-brand d-flex align-items-center justify-content-center">
          <i class="bi bi-box-seam-fill"></i>
        </div>
        <span class="brand-name text-dark">WIMS</span>
      </div>

      <div class="mb-4">
        <h2 class="form-title mb-1">Sign in to your account</h2>
        <p class="form-subtitle mb-0">Enter your credentials to access the system.</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

        <div class="mb-3">
          <app-input
            label="Email address"
            type="email"
            subscriptSizing="dynamic"
            placeholder="you@company.com"
            prefixIcon="mail_outline"
            [maxlength]="200"
            autocomplete="email"
            [customErrorMessage]="emailError"
            formControlName="email"
          />
        </div>

        <div class="mb-2">
          <app-input
            label="Password"
            type="password"
            placeholder="Enter your password"
            subscriptSizing="dynamic"
            [maxlength]="100"
            prefixIcon="lock_outline"
            autocomplete="current-password"
            [customErrorMessage]="passwordError"
            formControlName="password"
          />
        </div>

        <div class="d-flex justify-content-end mb-4">
          <a routerLink="/auth/forgot-password" class="forgot-link">Forgot password?</a>
        </div>

        <button
          mat-flat-button
          class="submit-btn w-100"
          type="submit"
          [disabled]="loading() || form.invalid"
        >
          @if (loading()) {
            <mat-spinner diameter="20" />
          } @else {
            <span>Sign In</span>
            <i class="bi bi-arrow-right ms-2"></i>
          }
        </button>

      </form>
    </div>
  </div>
</div>
