<app-dialog [loading]="submitting()">
  <div>

    <!-- list mode -->
    @if (mode() === 'list') {
    <div class="d-flex align-items-center justify-content-between mb-3">
      <span class="me-2 fs-6 fw-bold">{{ dataSource.data.length }} Units</span>
      <button mat-stroked-button color="primary" type="button" (click)="goToAdd()">
        <mat-icon>add</mat-icon> Add Unit
      </button>
    </div>

    @if (loading()) {
    <div class="d-flex align-items-center justify-content-center">
      <mat-spinner diameter="32" />
    </div>
    } @else {
    <table mat-table [dataSource]="dataSource" class="mb-3">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let row">{{ row.name }}</td>
      </ng-container>

      <ng-container matColumnDef="abbreviation">
        <th mat-header-cell *matHeaderCellDef>Abbreviation</th>
        <td mat-cell *matCellDef="let row">
          <span class="abbr-badge">{{ row.abbreviation }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button matTooltip = "Edit" matTooltipPosition="above" (click)="goToEdit(row)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button matTooltip = "Delete" matTooltipPosition="above" (click)="onDelete(row)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell no-data" colspan="3">No units configured yet.</td>
      </tr>
    </table>
    }
    }

    <!--add , edit mode  -->
    @if (isFormMode) {
    <div class="d-flex align-items-center mb-2">
      <button mat-icon-button type="button" (click)="goToList()">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <span>{{ formTitle }}</span>
    </div>

    <form [formGroup]="form">
      <app-input class="mb-3" formControlName="name" label="Unit Name" placeholder="e.g. Kilograms"
        [customErrorMessage]="getError('name')" />
      <app-input formControlName="abbreviation" label="Abbreviation" placeholder="e.g. kg"
        [customErrorMessage]="getError('abbreviation')" />
    </form>

    <div class="dialog-footer">
      <button
        class="btn-cancel"
        type="button"
        (click)="onClose()"
        [disabled]="loading() || submitting()"
      >
      cancel
      </button>

      <button
        class="btn-submit"
        type="button"
        [disabled]="loading() || submitting() || form.invalid"
        (click)="onSubmit()"
      >
        @if (submitting()) {
          <span class="spinner"></span>
        } @else {
          {{ submitLabel }}
        }
      </button>
    </div>
    }

  </div>
</app-dialog>
