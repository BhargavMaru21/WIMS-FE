<app-dialog
  [loading]="loading()"
  [submitDisabled]="isInvalid"
  (submitted)="onSubmit()"
>
  <form [formGroup]="form" novalidate>
    <div class="d-flex flex-column gap-3">
      <app-input
        label="Current password"
        type="password"
        placeholder="Enter current password"
        prefixIcon="lock_outline"
        autocomplete="current-password"
        [customErrorMessage]="currentPasswordError"
        formControlName="currentPassword"
      />
      <app-input
        label="New password"
        type="password"
        placeholder="Create a strong password"
        prefixIcon="lock_outline"
        hint="Min 8 chars · uppercase · lowercase · number · special"
        autocomplete="new-password"
        [customErrorMessage]="newPasswordError"
        formControlName="newPassword"
      />
      <app-input
        label="Confirm new password"
        type="password"
        placeholder="Repeat your new password"
        prefixIcon="lock_outline"
        autocomplete="new-password"
        [customErrorMessage]="confirmError"
        formControlName="confirmPassword"
      />
    </div>
  </form>
</app-dialog>
