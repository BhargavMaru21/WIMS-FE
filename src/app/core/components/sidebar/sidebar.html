<aside class="sidebar d-flex flex-column" [class.collapsed]="collapsed()">

  <!-- Sidebar Header / Mobile Close -->
  <div class="sidebar-header d-flex align-items-center justify-content-between p-3 border-bottom">
    <div class="d-flex align-items-center gap-2 overflow-hidden">
      <div class="sidebar-logo-icon flex-shrink-0">
        <mat-icon>inventory_2</mat-icon>
      </div>
      @if (!collapsed()) {
        <div class="d-flex flex-column overflow-hidden text-truncate">
          <span class="sidebar-brand-name">Warehouse OS</span>
          <span class="sidebar-brand-env">PROD v2.4</span>
        </div>
      }
    </div>

    <!-- Mobile Close Button -->
    <button
      class="mobile-close-btn d-lg-none btn-close text-reset"
      (click)="closeMobile.emit()"
      aria-label="Close menu"
      type="button"
    ></button>
  </div>

  <!-- Navigation Links -->
  <nav class="sidebar-nav d-flex flex-column gap-1 p-2 flex-grow-1 overflow-y-auto">
    @if (!collapsed() && roleLabel()) {
      <div class="nav-section-label px-2 pt-2 pb-1">
        <span>MENU</span>
      </div>
    }

    @for (item of navItems(); track item.route) {
      <a
        class="nav-item d-flex align-items-center gap-3 px-3 py-2 rounded-3 text-decoration-none"
        [routerLink]="item.route"
        routerLinkActive="active"
        [matTooltip]="collapsed() ? item.label : ''"
        matTooltipPosition="right"
        (click)="onNavClick()"
      >
        <mat-icon class="nav-icon flex-shrink-0">{{ item.icon }}</mat-icon>
        @if (!collapsed()) {
          <span class="nav-label">{{ item.label }}</span>
        }
      </a>
    }
  </nav>

  <!-- Sidebar Footer: Role Info -->
  @if (!collapsed() && roleLabel()) {
    <div class="sidebar-footer p-3 border-top mt-auto bg-light">
      <div class="role-card d-flex flex-column">
        <span class="role-badge">{{ roleLabel() }}</span>
        <span class="role-desc mt-1">{{ roleDesc() }}</span>
      </div>
    </div>
  }

</aside>
