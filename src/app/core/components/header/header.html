<header class="app-header d-flex align-items-center justify-content-between px-3 px-md-4">

  <!-- Left: Sidebar Toggle & Branding -->
  <div class="d-flex align-items-center gap-3">
    <button
      class="toggle-btn d-flex align-items-center justify-content-center"
      (click)="toggleSidebar.emit()"
      aria-label="Toggle navigation menu"
      type="button"
    >
      <i class="bi bi-list fs-5"></i>
    </button>

    <div class="brand-group d-flex align-items-center gap-2">
      <div class="brand-icon d-flex align-items-center justify-content-center">
        <i class="bi bi-box-seam-fill"></i>
      </div>
      <div class="d-flex flex-column d-none d-sm-flex">
        <span class="brand-text">WIMS</span>
        <span class="brand-subtext">Inventory Suite</span>
      </div>
    </div>
  </div>

  <!-- Right: Notifications & Profile Trigger -->
  <div class="d-flex align-items-center gap-2 gap-sm-3">
    <app-notification-dropdown />

    <app-dropdown title="My Account" [items]="profileItems" align="right">
      <div class="user-trigger d-flex align-items-center gap-2 px-2 py-1 rounded-3">
        <div class="user-avatar-wrap position-relative flex-shrink-0">
          <div class="user-avatar d-flex align-items-center justify-content-center rounded-circle">
            {{ initials || 'U' }}
          </div>
          <span class="online-indicator"></span>
        </div>
        <div class="user-info d-none d-md-flex flex-column text-start">
          <span class="user-name">{{ user?.name || 'Authorized User' }}</span>
          <span class="user-role">{{ user?.role || 'Staff' }}</span>
        </div>
        <i class="bi bi-chevron-down user-chevron d-none d-md-block ms-1"></i>
      </div>
    </app-dropdown>
  </div>

</header>
