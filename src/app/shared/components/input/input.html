<mat-form-field
  class="wims-input"
  [appearance]="appearance"
  [subscriptSizing]="subscriptSizing"
>
 <mat-label>{{ label }}@if (isRequired) {<span class="required-asterisk"> *</span>}</mat-label>

  @if (prefixIcon || prefixIconPath) {
    <span matPrefix class="input-prefix">
      @if (prefixIconPath) {
        <img [src]="prefixIconPath" width="18" height="18" alt="" aria-hidden="true" />
      } @else if (prefixIcon) {
        <mat-icon>{{ prefixIcon }}</mat-icon>
      }
    </span>
  }

  <input
    matInput
    class="input-element"
    [class.no-prefix]="!(prefixIcon || prefixIconPath)"
    [type]="effectiveType"
    [placeholder]="placeholder"
    [disabled]="disabled"
    [readonly]="readonly"
    [value]="value"
    [attr.minlength]="minlength ?? null"
    [attr.maxlength]="maxlength ?? null"
    [attr.min]="min ?? null"
    [attr.max]="max ?? null"
    [attr.step]="step ?? null"
    [attr.pattern]="pattern ?? null"
    [autocomplete]="autocomplete"
    (input)="handleInputEvent($event)"
    (blur)="onTouched(); markTouched()"
  />

  @if (type === 'password') {
    <button
      matSuffix
      mat-icon-button
      type="button"
      [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
      (click)="togglePasswordVisibility()"
    >
      <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
  }

  @if (type !== 'password' && (icon || iconPath)) {
    <button
      matSuffix
      mat-icon-button
      type="button"
      [attr.aria-label]="iconTooltip ?? 'Action'"
      [matTooltip]="iconTooltip ?? ''"
      (click)="handleIconClick()"
    >
      @if (iconPath) {
        <img [src]="iconPath" width="20" height="20" alt="" aria-hidden="true" />
      } @else if (icon) {
        <mat-icon>{{ icon }}</mat-icon>
      }
    </button>
  }

  @if (hint) {
    <mat-hint>{{ hint }}</mat-hint>
  }

  <mat-error>{{ errorMessage }}</mat-error>
</mat-form-field>
