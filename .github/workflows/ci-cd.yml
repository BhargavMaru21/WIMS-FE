name: WIMS Frontend CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-frontend:
    name: Build Angular Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build -- --configuration production

  build-and-push:
    name: Build, Push and Update GitOps
    needs: build-frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: bhargavmaru/wims-frontend
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Checkout GitOps repository
        uses: actions/checkout@v6
        with:
          repository: BhargavMaru21/WIMS-GitOps
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update frontend image tag
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          cd gitops

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("values.yaml")
          content = path.read_text()
          tag = os.environ["IMAGE_TAG"][:11]

          pattern = r'(?ms)(^frontend:\s*\n.*?^\s+tag:\s*)["\']?[^"\']+["\']?'
          updated, count = re.subn(
              pattern,
              lambda m: m.group(1) + '"' + tag + '"',
              content,
              count=1
          )

          if count != 1:
              raise SystemExit("Could not locate frontend.image.tag")

          path.write_text(updated)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add values.yaml

          if ! git diff --cached --quiet; then
            git commit -m "Deploy WIMS frontend ${IMAGE_TAG}"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "Frontend image tag is already up to date."
          fi
